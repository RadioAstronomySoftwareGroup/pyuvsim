name: Tests
on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  tests:
    env:
      ENV_NAME: ${{ case(matrix.os == 'windows-latest', 'pyuvsim_tests_windows', matrix.env_name) }}
      PYTHON: ${{ matrix.python-version }}
      OS: ${{ matrix.os }}
      # Windows can't handle pytest-xdist in our experience
      # we get warnings when we use both mpi-pytest and pytest-xdist (breaks warnings test)
      PYTEST_OPTIONS:  ${{ case(matrix.warn_error == true, '-W error', '') }} ${{ case(matrix.os == 'windows-latest', '', matrix.warn_error == true, '', '-n auto') }} --cov=pyuvsim --cov-config=.coveragerc --cov-report xml:./coverage.xml
    name: Testing
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Adding -l {0} helps ensure conda can be found properly.
        shell: bash -l {0}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        env_name: [pyuvsim_tests_openmpi]
        warn_error: [false]
        include:
          - os: ubuntu-latest
            python-version: "3.14"
            env_name: pyuvsim_tests_mpich
            warn_error: false
          - os: macos-latest
            python-version: "3.14"
            env_name: pyuvsim_tests_mpich
            warn_error: false
          - os: ubuntu-latest
            python-version: "3.14"
            env_name: pyuvsim_tests_mpich
            warn_error: true  # warnings test
          - os: ubuntu-latest
            python-version: "3.11"
            env_name: min_versions
            warn_error: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Miniforge
        uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5 # v4.0.1
        with:
          miniforge-version: latest
          python-version: ${{ env.PYTHON }}
          environment-file: ci/${{ env.ENV_NAME }}.yaml
          activate-environment: ${{ env.ENV_NAME }}
          conda-remove-defaults: "true"

      - name: Conda Info
        run: |
          conda info -a
          conda list
          PYVER=`python -c "import sys; print('{:d}.{:d}'.format(sys.version_info.major, sys.version_info.minor))"`
          if [[ $PYVER != $PYTHON ]]; then
            exit 1;
          fi

      - name: Install
        # calling git right before the install seems to prevent a time-out within setuptools_scm on MacOS
        run: |
          git describe --tags
          git version
          SETUPTOOLS_SCM_DEBUG=1 pip install --no-deps .

      - name: Run Tests 1
        id: test1
        continue-on-error: true
        run: |
          UCX_TLS=self,sm,tcp pytest ${PYTEST_OPTIONS}

      # Using this manual retry approach rather than the nick-fields/retry action
      # because that action does not let us set up the shell properly to use the
      # conda env
      # Retry the test step above that can fail
      - name: Run Tests 2
        id: test2
        # Only run this step if step 1 fails. It knows that step one failed because we specified an `id` for the first step
        if: steps.test1.outcome == 'failure'
        # This needs to be true to proceed to the next step of failure
        continue-on-error: true
        run: |
          UCX_TLS=self,sm,tcp pytest ${PYTEST_OPTIONS}

      # Using this manual retry approach rather than the nick-fields/retry action
      # because that action does not let us set up the shell properly to use the
      # conda env
      # 2nd Retry of the test step above that can fail
      - name: Run Tests 3
        id: test3
        # Only run this step if step 2 fails. It knows that step 2 failed because we specified an `id`
        if: steps.test2.outcome == 'failure'
        # This needs to be true to proceed to the next step of failure
        run: |
          UCX_TLS=self,sm,tcp pytest ${PYTEST_OPTIONS}

      - name: check coverage report
        run: |
          ls
          cat coverage.xml

      - name: Upload Coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        if: success()
        with:
          token: ${{secrets.CODECOV_TOKEN}} #required
          file: ./coverage.xml #optional
          env_vars: OS,PYTHON
          fail_ci_if_error: true

  # Use pip for diversity
  # do this on min_deps because it's hard to get mpi4py to install from pip
  min_deps:
    env:
      PYTHON: "3.14"
    name: Min Deps Testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON }}

      # Just install the test requirements, also install pytest-xdist for speed
      - name: Install
        run: |
          pip install -e .[test]
          pip install pytest-xdist

      - name: Environment Info
        run: |
          pip list
          PYVER=`python -c "import sys; print('{:d}.{:d}'.format(sys.version_info.major, sys.version_info.minor))"`
          if [[ $PYVER != $PYTHON ]]; then
            exit 1;
          fi

      - name: Run Tests
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_on: error
          shell: bash
          command: |
            UCX_TLS=self,sm,tcp pytest -n auto --cov=pyuvsim --cov-config=.coveragerc --cov-report xml:./coverage.xml

      - name: check coverage report
        run: |
          ls
          cat coverage.xml

      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        if: success()
        with:
          token: ${{secrets.CODECOV_TOKEN}} #required
          files: ./coverage.xml #optional
          fail_ci_if_error: true

  download_test:
    env:
      ENV_NAME: pyuvsim_tests_refsim
      PYTHON: "3.14"
    name: Download Test
    runs-on: ubuntu-latest
    defaults:
      run:
        # Adding -l {0} helps ensure conda can be found properly.
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Miniforge
        uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5 # v4.0.1
        with:
          miniforge-version: latest
          python-version: ${{ env.PYTHON }}
          environment-file: ci/${{ env.ENV_NAME }}.yaml
          activate-environment: ${{ env.ENV_NAME }}
          conda-remove-defaults: "true"

      - name: Conda Info
        run: |
          conda info -a
          conda list
          PYVER=`python -c "import sys; print('{:d}.{:d}'.format(sys.version_info.major, sys.version_info.minor))"`
          if [[ $PYVER != $PYTHON ]]; then
            exit 1;
          fi

      - name: Install
        run: |
          pip install --no-deps .

      - name: Run Tests 1
        id: test1
        continue-on-error: true
        run: |
          UCX_TLS=self,sm,tcp mpiexec -n 1 pytest tests/test_run_ref.py -k "test_download or test_run_ref_sim_cli" --cov=pyuvsim --cov-config=.coveragerc --cov-report xml:./coverage.xml

      # Using this manual retry approach rather than the nick-fields/retry action
      # because that action does not let us set up the shell properly to use the
      # conda env
      # Retry the test step above that can fail
      - name: Run Tests 2
        id: test2
        # Only run this step if step 1 fails. It knows that step one failed because we specified an `id` for the first step
        if: steps.test1.outcome == 'failure'
        # This needs to be true to proceed to the next step of failure
        continue-on-error: true
        run: |
          UCX_TLS=self,sm,tcp mpiexec -n 1 pytest tests/test_run_ref.py -k "test_download or test_run_ref_sim_cli" --cov=pyuvsim --cov-config=.coveragerc --cov-report xml:./coverage.xml

      # Using this manual retry approach rather than the nick-fields/retry action
      # because that action does not let us set up the shell properly to use the
      # conda env
      # 2nd Retry of the test step above that can fail
      - name: Run Tests 3
        id: test3
        # Only run this step if step 2 fails. It knows that step 2 failed because we specified an `id`
        if: steps.test2.outcome == 'failure'
        # This needs to be true to proceed to the next step of failure
        run: |
          UCX_TLS=self,sm,tcp mpiexec -n 1 pytest tests/test_run_ref.py -k "test_download or test_run_ref_sim_cli" --cov=pyuvsim --cov-config=.coveragerc --cov-report xml:./coverage.xml

      - name: check coverage report
        run: |
          ls
          cat coverage.xml

      - name: Upload Coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        if: success()
        with:
          token: ${{secrets.CODECOV_TOKEN}} #required
          file: ./coverage.xml #optional
          env_vars: OS,PYTHON
          fail_ci_if_error: true
